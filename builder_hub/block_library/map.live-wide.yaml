# //// Neoffice — added file (no upstream equivalent): seed block of the hub's library, carrying a live component of the site.
id: map.live-wide
title: Carte sur toute la largeur
kinds:
- map
look: a centred heading and lead, then the map of the site's address across the whole width of the page, rounded
photos: 0
form: true
component: google_map.html
ground: plain
motion: None
tree:
  el: section
  name: map-wide
  style:
    backgroundColor: '{{ground.background}}'
    width: 100%
    padding: 6rem 0
  m_style:
    padding: 4rem 0
  c:
  - el: div
    name: container
    style:
      maxWidth: '{{container}}'
      width: 100%
      margin: 0 auto
      paddingLeft: '{{gutter}}'
      paddingRight: '{{gutter}}'
    m_style:
      paddingLeft: '{{gutter_phone}}'
      paddingRight: '{{gutter_phone}}'
    c:
    - el: div
      name: copy
      style:
        display: flex
        flexDirection: column
        alignItems: center
        minWidth: '0'
        marginBottom: 2.5rem
      c:
      - el: h2
        name: heading
        style:
          color: '{{ground.ink}}'
          fontFamily: '{{font_heading}}'
          fontSize: 2.5rem
          fontWeight: '700'
          lineHeight: '1.15'
          margin: 0 0 1.25rem
          maxWidth: 36rem
          textAlign: center
          marginLeft: auto
          marginRight: auto
        t_style:
          fontSize: 2.125rem
        m_style:
          fontSize: 1.75rem
          overflowWrap: break-word
        text: 'WRITE heading: 3 to 6 words'
      - el: p
        name: lead
        style:
          color: '{{ground.muted}}'
          fontFamily: '{{font_body}}'
          fontSize: 1.0625rem
          lineHeight: '1.7'
          margin: '0'
          maxWidth: 34rem
          textAlign: center
          marginLeft: auto
          marginRight: auto
        text: 'WRITE lead: 12 to 24 words'
      m_style:
        marginBottom: 2rem
    - el: div
      name: map
      style:
        width: 100%
        minWidth: '0'
      text: '{{include_component}}'
