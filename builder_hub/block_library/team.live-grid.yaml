# //// Neoffice — added file (no upstream equivalent): seed block of the hub's library, carrying a live component of the site.
id: team.live-grid
title: L'équipe du site, titre centré
kinds:
- team
look: a centred label, heading and lead over the site's own team (from its About Us page), each person with a photograph, a name and a role
photos: 0
form: true
component: team_grid.html
ground: plain
motion: None
notes: The people are the site's own; the block writes no name.
tree:
  el: section
  name: team
  style:
    backgroundColor: '{{ground.background}}'
    width: 100%
    padding: 6rem 0
  m_style:
    padding: 4rem 0
  c:
  - el: div
    name: container
    style:
      maxWidth: '{{container}}'
      width: 100%
      margin: 0 auto
      paddingLeft: '{{gutter}}'
      paddingRight: '{{gutter}}'
    m_style:
      paddingLeft: '{{gutter_phone}}'
      paddingRight: '{{gutter_phone}}'
    c:
    - el: div
      name: copy
      style:
        display: flex
        flexDirection: column
        alignItems: center
        minWidth: '0'
        marginBottom: 3rem
      c:
      - el: p
        name: label
        style:
          color: color-mix(in srgb, {{ground.accent}} 80%, {{ground.ink}})
          fontFamily: '{{font_body}}'
          fontSize: 0.75rem
          fontWeight: '700'
          letterSpacing: 0.25em
          textTransform: uppercase
          margin: 0 0 1rem
          textAlign: center
        text: 'WRITE label: 1 to 3 words naming the subject'
      - el: h2
        name: heading
        style:
          color: '{{ground.ink}}'
          fontFamily: '{{font_heading}}'
          fontSize: 2.5rem
          fontWeight: '700'
          lineHeight: '1.15'
          margin: 0 0 1.25rem
          maxWidth: 36rem
          textAlign: center
          marginLeft: auto
          marginRight: auto
        t_style:
          fontSize: 2.125rem
        m_style:
          fontSize: 1.75rem
          overflowWrap: break-word
        text: 'WRITE heading: 3 to 6 words'
      - el: p
        name: lead
        style:
          color: '{{ground.muted}}'
          fontFamily: '{{font_body}}'
          fontSize: 1.0625rem
          lineHeight: '1.7'
          margin: '0'
          maxWidth: 34rem
          textAlign: center
          marginLeft: auto
          marginRight: auto
        text: 'WRITE lead: 14 to 26 words'
      m_style:
        marginBottom: 2rem
    - el: div
      name: people
      style:
        width: 100%
        minWidth: '0'
      text: '{{include_component}}'
