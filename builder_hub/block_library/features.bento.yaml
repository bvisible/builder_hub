# //// Neoffice — added file (no upstream equivalent): seed block of the hub's library.
id: features.bento
title: Mosaïque à grande tuile sombre
kinds: [cards, feature-grid]
look: "an uneven grid of five tiles, one large tile on a deep ground beside four smaller ones; the offer at a glance, more editorial than a row of equal cards"
photos: 0
ground: plain
motion: None
notes: "Tiles collapse to two columns on a tablet and one on a phone, the large tile keeps the full width on a tablet."
tree:
  el: section
  name: bento
  style: {backgroundColor: "{{ground.background}}", width: 100%, padding: 6rem 0}
  m_style: {padding: 4rem 0}
  c:
    - el: div
      name: container
      style: {maxWidth: "{{container}}", width: 100%, margin: 0 auto, paddingLeft: "{{gutter}}", paddingRight: "{{gutter}}"}
      m_style: {paddingLeft: "{{gutter_phone}}", paddingRight: "{{gutter_phone}}"}
      c:
        - el: div
          name: head
          style: {display: flex, flexDirection: column, alignItems: flex-start, marginBottom: 3rem}
          c:
            - el: p
              name: label
              style: {fontFamily: "{{font_body}}", fontSize: 0.75rem, fontWeight: "700", letterSpacing: 0.3em, textTransform: uppercase, color: "{{ground.accent}}", margin: 0 0 1.25rem}
              text: "WRITE label: 2 to 4 words naming the subject"
            - el: h2
              name: heading
              style: {fontFamily: "{{font_heading}}", fontSize: 3rem, fontWeight: "700", lineHeight: "1.15", color: "{{ground.ink}}", margin: 0 0 1.25rem, maxWidth: 40rem}
              m_style: {fontSize: 1.75rem}
              text: "WRITE heading: 4 to 8 words, one accent word"
            - el: p
              name: lead
              style: {fontFamily: "{{font_body}}", fontSize: 1.25rem, lineHeight: "1.7", color: "{{ground.ink}}", margin: 0, maxWidth: 36rem}
              text: "WRITE lead: one sentence of 20 to 30 words saying what the business offers"
        - el: div
          name: tiles
          style: {display: grid, gridTemplateColumns: "repeat(6, 1fr)", gridAutoRows: "minmax(11rem, auto)", gap: 1.25rem}
          t_style: {gridTemplateColumns: "repeat(2, 1fr)"}
          m_style: {gridTemplateColumns: 1fr}
          c:
            - el: div
              name: tile-large
              ground: deep
              classes: [u-card]
              style: {gridColumn: span 4, gridRow: span 2, backgroundColor: "{{ground.background}}", padding: 2.5rem, display: flex, flexDirection: column, justifyContent: flex-end}
              t_style: {gridColumn: span 2, gridRow: auto}
              m_style: {gridColumn: auto, gridRow: auto, padding: 1.75rem}
              c:
                - el: p
                  name: numeral
                  style: {fontFamily: "{{font_body}}", fontSize: 0.75rem, fontWeight: "700", letterSpacing: 0.3em, color: "{{ground.accent}}", margin: 0 0 1rem}
                  text: "WRITE numeral: an index numeral such as 01"
                - el: h3
                  name: item-title
                  style: {fontFamily: "{{font_heading}}", fontSize: 2.25rem, fontWeight: "700", lineHeight: "1.15", color: "{{ground.ink}}", margin: 0 0 1rem, maxWidth: 26rem}
                  m_style: {fontSize: 1.625rem}
                  text: "WRITE item-title: 2 to 5 words naming the main offer"
                - el: p
                  name: item-text
                  style: {fontFamily: "{{font_body}}", fontSize: 1.0625rem, lineHeight: "1.7", color: "{{ground.muted}}", margin: 0, maxWidth: 30rem}
                  text: "WRITE item-text: two sentences, 30 to 45 words, from the business's own facts"
            - el: div
              name: tile
              classes: [u-card]
              style: {gridColumn: span 2, padding: 2rem, display: flex, flexDirection: column}
              t_style: {gridColumn: auto}
              m_style: {padding: 1.5rem}
              c:
                - el: p
                  name: numeral
                  style: {fontFamily: "{{font_body}}", fontSize: 0.75rem, fontWeight: "700", letterSpacing: 0.3em, color: "{{ground.accent}}", margin: 0 0 0.75rem}
                  text: "WRITE numeral: an index numeral such as 02"
                - el: h3
                  name: item-title
                  style: {fontFamily: "{{font_heading}}", fontSize: 1.375rem, fontWeight: "700", lineHeight: "1.25", color: "{{ground.ink}}", margin: 0 0 0.75rem}
                  text: "WRITE item-title: 2 to 5 words naming the offer"
                - el: p
                  name: item-text
                  style: {fontFamily: "{{font_body}}", fontSize: 1rem, lineHeight: "1.65", color: "{{ground.muted}}", margin: 0}
                  text: "WRITE item-text: one sentence of 15 to 25 words"
            - el: div
              name: tile
              classes: [u-card]
              style: {gridColumn: span 2, padding: 2rem, display: flex, flexDirection: column}
              t_style: {gridColumn: auto}
              m_style: {padding: 1.5rem}
              c:
                - el: p
                  name: numeral
                  style: {fontFamily: "{{font_body}}", fontSize: 0.75rem, fontWeight: "700", letterSpacing: 0.3em, color: "{{ground.accent}}", margin: 0 0 0.75rem}
                  text: "WRITE numeral: an index numeral such as 03"
                - el: h3
                  name: item-title
                  style: {fontFamily: "{{font_heading}}", fontSize: 1.375rem, fontWeight: "700", lineHeight: "1.25", color: "{{ground.ink}}", margin: 0 0 0.75rem}
                  text: "WRITE item-title: 2 to 5 words naming the offer"
                - el: p
                  name: item-text
                  style: {fontFamily: "{{font_body}}", fontSize: 1rem, lineHeight: "1.65", color: "{{ground.muted}}", margin: 0}
                  text: "WRITE item-text: one sentence of 15 to 25 words"
            - el: div
              name: tile
              classes: [u-card]
              style: {gridColumn: span 3, padding: 2rem, display: flex, flexDirection: column}
              t_style: {gridColumn: auto}
              m_style: {padding: 1.5rem}
              c:
                - el: p
                  name: numeral
                  style: {fontFamily: "{{font_body}}", fontSize: 0.75rem, fontWeight: "700", letterSpacing: 0.3em, color: "{{ground.accent}}", margin: 0 0 0.75rem}
                  text: "WRITE numeral: an index numeral such as 04"
                - el: h3
                  name: item-title
                  style: {fontFamily: "{{font_heading}}", fontSize: 1.375rem, fontWeight: "700", lineHeight: "1.25", color: "{{ground.ink}}", margin: 0 0 0.75rem}
                  text: "WRITE item-title: 2 to 5 words naming the offer"
                - el: p
                  name: item-text
                  style: {fontFamily: "{{font_body}}", fontSize: 1rem, lineHeight: "1.65", color: "{{ground.muted}}", margin: 0}
                  text: "WRITE item-text: one sentence of 15 to 25 words"
            - el: div
              name: tile
              classes: [u-card]
              style: {gridColumn: span 3, padding: 2rem, display: flex, flexDirection: column}
              t_style: {gridColumn: auto}
              m_style: {padding: 1.5rem}
              c:
                - el: p
                  name: numeral
                  style: {fontFamily: "{{font_body}}", fontSize: 0.75rem, fontWeight: "700", letterSpacing: 0.3em, color: "{{ground.accent}}", margin: 0 0 0.75rem}
                  text: "WRITE numeral: an index numeral such as 05"
                - el: h3
                  name: item-title
                  style: {fontFamily: "{{font_heading}}", fontSize: 1.375rem, fontWeight: "700", lineHeight: "1.25", color: "{{ground.ink}}", margin: 0 0 0.75rem}
                  text: "WRITE item-title: 2 to 5 words naming the offer"
                - el: p
                  name: item-text
                  style: {fontFamily: "{{font_body}}", fontSize: 1rem, lineHeight: "1.65", color: "{{ground.muted}}", margin: 0}
                  text: "WRITE item-text: one sentence of 15 to 25 words"
