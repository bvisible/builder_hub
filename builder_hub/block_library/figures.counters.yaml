# //// Neoffice — added file (no upstream equivalent): seed block of the hub's library.
id: figures.counters
title: Trois grands chiffres animés
kinds: [figures]
look: "a heading and a quiet sentence, then three large numerals each over a hairline, counting up to themselves as they come into view; proof at a glance that moves once and rests"
photos: 0
ground: tint
motion: Calm
notes: "The numbers count up once, when seen (the footer's script of the site, theme_variables.html 'The motion layer'); the heading and the three columns rise in turn. With motion off, or asked off by the visitor, the page is the page the words were written for. Offered only to a site whose material gives at least two figures."
tree:
  el: section
  name: counters
  style: {backgroundColor: "{{ground.background}}", width: 100%, padding: 7rem 0}
  m_style: {padding: 4.5rem 0}
  c:
    - el: div
      name: container
      style: {maxWidth: "{{container}}", width: 100%, margin: 0 auto, paddingLeft: "{{gutter}}", paddingRight: "{{gutter}}"}
      m_style: {paddingLeft: "{{gutter_phone}}", paddingRight: "{{gutter_phone}}"}
      c:
        - el: div
          name: head
          classes: [u-reveal]
          style: {display: flex, flexDirection: column, alignItems: flex-start, margin: 0 0 4rem, maxWidth: 40rem}
          m_style: {margin: 0 0 2.5rem}
          c:
            - el: p
              name: label
              style: {fontFamily: "{{font_body}}", fontSize: 0.75rem, fontWeight: "700", letterSpacing: 0.3em, textTransform: uppercase, color: "{{ground.accent}}", margin: 0 0 1.25rem}
              text: "WRITE label: 2 to 4 words naming the subject"
            - el: h2
              name: heading
              style: {fontFamily: "{{font_heading}}", fontSize: 3rem, fontWeight: "700", lineHeight: "1.15", color: "{{ground.ink}}", margin: 0 0 1.25rem}
              m_style: {fontSize: 1.875rem}
              text: "WRITE heading: 4 to 8 words, one accent word"
            - el: p
              name: lead
              style: {fontFamily: "{{font_body}}", fontSize: 1.125rem, lineHeight: "1.7", color: "{{ground.muted}}", margin: 0}
              text: "WRITE lead: one sentence of 15 to 25 words saying what the figures show"
        - el: div
          name: figures
          classes: [u-reveal-group]
          style: {display: grid, gridTemplateColumns: "repeat(3, minmax(0, 1fr))", gap: 3rem}
          t_style: {gap: 2rem}
          m_style: {gridTemplateColumns: "minmax(0, 1fr)", gap: 2.5rem}
          c:
            - el: div
              name: figure-item
              style: {borderTop: "1px solid {{ground.hair}}", paddingTop: 1.75rem}
              c:
                - el: p
                  name: figure
                  classes: [u-count]
                  style: {fontFamily: "{{font_heading}}", fontSize: 5rem, fontWeight: "700", lineHeight: "1", color: "{{ground.ink}}", margin: 0 0 0.75rem}
                  t_style: {fontSize: 3.75rem}
                  m_style: {fontSize: 3.5rem}
                  text: "WRITE figure: one number in digits, with a sign or a short unit after it if the material has one (+, %, h, km); a quantity the material gives, never a year, never invented"
                - el: p
                  name: figure-label
                  style: {fontFamily: "{{font_body}}", fontSize: 1.0625rem, lineHeight: "1.5", color: "{{ground.muted}}", margin: 0, maxWidth: 16rem}
                  text: "WRITE figure-label: what the figure counts, 2 to 6 words"
            - el: div
              name: figure-item
              style: {borderTop: "1px solid {{ground.hair}}", paddingTop: 1.75rem}
              c:
                - el: p
                  name: figure
                  classes: [u-count]
                  style: {fontFamily: "{{font_heading}}", fontSize: 5rem, fontWeight: "700", lineHeight: "1", color: "{{ground.ink}}", margin: 0 0 0.75rem}
                  t_style: {fontSize: 3.75rem}
                  m_style: {fontSize: 3.5rem}
                  text: "WRITE figure: one number in digits, with a sign or a short unit after it if the material has one (+, %, h, km); a quantity the material gives, never a year, never invented"
                - el: p
                  name: figure-label
                  style: {fontFamily: "{{font_body}}", fontSize: 1.0625rem, lineHeight: "1.5", color: "{{ground.muted}}", margin: 0, maxWidth: 16rem}
                  text: "WRITE figure-label: what the figure counts, 2 to 6 words"
            - el: div
              name: figure-item
              style: {borderTop: "1px solid {{ground.hair}}", paddingTop: 1.75rem}
              c:
                - el: p
                  name: figure
                  classes: [u-count]
                  style: {fontFamily: "{{font_heading}}", fontSize: 5rem, fontWeight: "700", lineHeight: "1", color: "{{ground.ink}}", margin: 0 0 0.75rem}
                  t_style: {fontSize: 3.75rem}
                  m_style: {fontSize: 3.5rem}
                  text: "WRITE figure: one number in digits, with a sign or a short unit after it if the material has one (+, %, h, km); a quantity the material gives, never a year, never invented"
                - el: p
                  name: figure-label
                  style: {fontFamily: "{{font_body}}", fontSize: 1.0625rem, lineHeight: "1.5", color: "{{ground.muted}}", margin: 0, maxWidth: 16rem}
                  text: "WRITE figure-label: what the figure counts, 2 to 6 words"
